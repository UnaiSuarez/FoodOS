# CI de FoodOS: type-check + tests en cada PR y en cada push a main.
# No incluye lint porque ESLint no está configurado en el repo (next lint
# pide setup interactivo) — si algún día se configura, añadir el paso aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm run test --workspace @foodos/web

      # E21-19: build de producción real (sin NEXT_PUBLIC_SUPABASE_URL/
      # ANON_KEY en el entorno del runner, igual que el job e2e — la app
      # arranca en modo local-only) + comprobación de que el JS del cliente
      # no ha crecido de forma excesiva desde el último cambio.
      - name: Build de producción
        working-directory: apps/web
        run: npx next build

      - name: Comprobar tamaño de bundle
        working-directory: apps/web
        run: npm run check:bundle-size

  # E21-01: flujos críticos con Playwright. Job aparte (no bloquea el
  # type-check/vitest si tarda más) — corre siempre en modo local-only, sin
  # NEXT_PUBLIC_SUPABASE_URL/ANON_KEY definidas en el entorno del runner, así
  # que no necesita secretos ni una cuenta de prueba real (ver
  # playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Flujos críticos (Playwright)
        working-directory: apps/web
        run: npx playwright test

      - name: Subir informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
